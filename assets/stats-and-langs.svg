<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#061020"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F05138"/>
      <stop offset="100%" stop-color="#FF7B54"/>
    </linearGradient>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02569B"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="objcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- LEFT CARD: Engineering Impact & Metrics -->
  <g transform="translate(0, 0)">
    <rect width="585" height="220" rx="14" fill="url(#cardBg)" stroke="#00B4D8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#00B4D8">
      ⚡ Engineering Impact &amp; KPIs
    </text>
    <line x1="28" y1="52" x2="557" y2="52" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Row 1 -->
    <g transform="translate(28, 72)">
      <rect width="250" height="56" rx="10" fill="#112240" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8892B0">PRODUCTION APPS SHIPPED</text>
      <text x="16" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">20+ Apps <tspan font-size="13" font-weight="600" fill="#34D399">(1M+ Users)</tspan></text>
    </g>

    <g transform="translate(302, 72)">
      <rect width="255" height="56" rx="10" fill="#112240" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8892B0">APP STORE RATING UPGRADE</text>
      <text x="16" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFCA28">3.9 → 4.6 ★ <tspan font-size="13" font-weight="600" fill="#90E0EF">(-35% Crashes)</tspan></text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(28, 142)">
      <rect width="250" height="56" rx="10" fill="#112240" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8892B0">RELEASE CYCLE VELOCITY</text>
      <text x="16" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#00B4D8">65% Faster <tspan font-size="13" font-weight="600" fill="#8892B0">via CI/CD</tspan></text>
    </g>

    <g transform="translate(302, 142)">
      <rect width="255" height="56" rx="10" fill="#112240" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8892B0">MIGRATION COST SAVINGS</text>
      <text x="16" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34D399">-30% Cost <tspan font-size="13" font-weight="600" fill="#8892B0">(iOS → Flutter)</tspan></text>
    </g>
  </g>

  <!-- RIGHT CARD: Top Languages & Ecosystem Proficiency -->
  <g transform="translate(615, 0)">
    <rect width="585" height="220" rx="14" fill="url(#cardBg)" stroke="#00B4D8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#00B4D8">
      💻 Core Languages &amp; Stack Distribution
    </text>
    <line x1="28" y1="52" x2="557" y2="52" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Stacked Multi-Color Bar -->
    <g transform="translate(28, 68)">
      <rect x="0" y="0" width="235" height="12" rx="4" fill="url(#swiftGrad)"/>
      <rect x="239" y="0" width="200" height="12" rx="4" fill="url(#flutterGrad)"/>
      <rect x="443" y="0" width="48" height="12" rx="4" fill="url(#objcGrad)"/>
      <rect x="495" y="0" width="34" height="12" rx="4" fill="url(#cicdGrad)"/>
    </g>

    <!-- Language Breakdown Bars -->
    <!-- 1. Swift / SwiftUI / UIKit -->
    <g transform="translate(28, 102)">
      <circle cx="8" cy="-4" r="6" fill="#F05138"/>
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E6F1FF">Swift · SwiftUI · UIKit</text>
      <text x="529" y="0" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#F05138" text-anchor="end">45%</text>
      <rect x="220" y="-9" width="250" height="8" rx="4" fill="#112240"/>
      <rect x="220" y="-9" width="215" height="8" rx="4" fill="url(#swiftGrad)"/>
    </g>

    <!-- 2. Dart / Flutter -->
    <g transform="translate(28, 132)">
      <circle cx="8" cy="-4" r="6" fill="#00B4D8"/>
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E6F1FF">Dart · Flutter Framework</text>
      <text x="529" y="0" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#00B4D8" text-anchor="end">38%</text>
      <rect x="220" y="-9" width="250" height="8" rx="4" fill="#112240"/>
      <rect x="220" y="-9" width="190" height="8" rx="4" fill="url(#flutterGrad)"/>
    </g>

    <!-- 3. Objective-C & Native SDKs -->
    <g transform="translate(28, 162)">
      <circle cx="8" cy="-4" r="6" fill="#818CF8"/>
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E6F1FF">Objective-C · WatchKit · WidgetKit</text>
      <text x="529" y="0" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#818CF8" text-anchor="end">10%</text>
      <rect x="220" y="-9" width="250" height="8" rx="4" fill="#112240"/>
      <rect x="220" y="-9" width="60" height="8" rx="4" fill="url(#objcGrad)"/>
    </g>

    <!-- 4. CI/CD, Fastlane & YAML -->
    <g transform="translate(28, 192)">
      <circle cx="8" cy="-4" r="6" fill="#34D399"/>
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E6F1FF">Fastlane · YAML · Shell (CI/CD)</text>
      <text x="529" y="0" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#34D399" text-anchor="end">7%</text>
      <rect x="220" y="-9" width="250" height="8" rx="4" fill="#112240"/>
      <rect x="220" y="-9" width="42" height="8" rx="4" fill="url(#cicdGrad)"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#F05138"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F05138" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- Decorative Glow Orbs -->
  <circle cx="150" cy="50" r="130" fill="#00B4D8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="220" r="150" fill="#F05138" opacity="0.10" filter="url(#glow)"/>

  <!-- Subtle Tech Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
    <line x1="960" y1="0" x2="960" y2="280"/>
  </g>

  <!-- Layered Dynamic Waves -->
  <path d="M0,210 C320,270 580,150 900,215 C1050,245 1140,210 1200,195 L1200,280 L0,280 Z" fill="url(#waveGrad)"/>
  <path d="M0,235 C280,185 640,265 960,220 C1090,200 1160,225 1200,235 L1200,280 L0,280 Z" fill="#00B4D8" fill-opacity="0.08"/>

  <!-- Top Accent Pill -->
  <rect x="425" y="34" width="350" height="28" rx="14" fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="600" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#90E0EF" text-anchor="middle" letter-spacing="2">
    AVAILABLE FOR SENIOR &amp; LEAD ROLES
  </text>

  <!-- Name Title -->
  <text x="600" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Mostafa Abd El-Fatah
  </text>

  <!-- Role Subtitle -->
  <text x="600" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accent)" text-anchor="middle" letter-spacing="1">
    Senior Mobile Developer  ·  iOS &amp; Flutter Architect
  </text>

  <!-- Accent Divider Line -->
  <rect x="490" y="178" width="220" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Key Metrics Row -->
  <text x="600" y="216" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="500" fill="#CAF0F8" text-anchor="middle" letter-spacing="0.8">
    8+ Years Exp   •   20+ Production Apps   •   1M+ Downloads   •   4.5+ ★ App Store Rating
  </text>

  <!-- Outer Subtle Border -->
  <rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="#00B4D8" stroke-opacity="0.25" stroke-width="2"/>
</svg>
